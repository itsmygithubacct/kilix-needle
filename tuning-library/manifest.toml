# How kilix-needle fine-tunes Needle 2 from this library. Read by
# `kilix-needle tune`; every input is pinned and every output is gated.
schema = "kilix-needle-tuning/v1"

[source]
# Needle 2's training code. The repository's main branch is Needle 3; v2.0.9
# is the last Needle 2 release and has no telemetry module.
url = "https://github.com/cactus-compute/needle.git"
tag = "v2.0.9"
commit = "571fcd68f48b6649c91f353eb91d0a0c9b9135ce"
licence = "Apache-2.0"

[base]
# Content assets; the tuner reads them installed and verified, never downloads them.
checkpoint_asset = "needle2-train"      # checkpoints/needle2.pkl + tokenizer files
runtime_asset = "needle2-runtime"       # libneedle.so, which can load a tuned .cact
# needle2.pkl is a pickle: it is loaded only after this digest matches.
checkpoint_sha256 = "4b0a972d163ffc7678fb3c36bace508114872e9d2ce9e10f225825752d3795bc"
tokenizer_model_sha256 = "0871b8e3df78e0dd7ccc236e187fc055f75cd57ebe3bec76ca8103030b8fe659"
tokenizer_vocab_sha256 = "ed835aff5b2a3ca67b5896906dd471ab0ce12626d699d90e736e3c7e4ba9b1e3"

[environment]
python = "3.13"
requirements = "requirements-train.lock"   # hash-locked; installed with --require-hashes
# Training never needs the network: the source and base files are in place
# before it starts, and it runs in its own network namespace where available.
offline = true

[data]
toolset = "five"       # the schema the tuned model is trained and served with
seed = 0
per_template = 12
# Requests in these kilix-needle eval sets are never trained on.
exclude = ["evals/dev.jsonl", "evals/test.jsonl", "evals/heldout-v2.jsonl",
           "evals/heldout-v3.jsonl", "evals/heldout-v4.jsonl"]

[train]
epochs = 2
batch_size = 16
learning_rate = 2e-4
lora_rank = 16
lora_alpha = 32.0
max_len = 1024
val_split = 0.1

[gates]
# A tuned model is selected only if every gate passes; otherwise the base
# model stays in use and the run's report says which gate failed.
unsafe_max = 0                          # on every eval set
reference = "base-ten"                  # the untuned model, ten tools: measured at gate time
# Written by a session that saw neither this corpus nor the earlier sets. v2
# and v3 were each consulted while fixing kilix-needle's checks, so they no
# longer gate; a set that has shaped a decision is spent.
heldout = "evals/heldout-v4.jsonl"
min_heldout_exact_gain = 5              # percentage points over the reference
no_tag_regression_above = 2             # cases lost in any one tag on the held-out set
